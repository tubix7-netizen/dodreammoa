<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
color-scheme:light;--bg:#f6faff;--card:#fff;--tx:#10244d;--mu:#5d6f94;--ac:#2a6df0;--ac2:#e6f0ff;--bd:#d9e6fb;--wa:#d9531e;--pt:#e39a00;--ye:#ffc933}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(180deg,#d9eaff 0,#f6faff 260px,#fffbea 100%) fixed;color:var(--tx);font-family:"Noto Sans KR",system-ui,-apple-system,"Malgun Gothic",sans-serif;line-height:1.5}
#app{max-width:480px;margin:0 auto;padding:16px 16px 90px}
h1{font-size:20px;margin:4px 0 14px}h2{font-size:16px;margin:18px 0 8px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px;margin-bottom:12px}
.hero{background:linear-gradient(135deg,#2a6df0,#5aa2ff);color:#fff;border:0;box-shadow:0 6px 18px rgba(42,109,240,.25)}.hero .big{color:#ffe066}.hero small{opacity:.85}.big{font-size:38px;font-weight:700;line-height:1.1}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.mu{color:var(--mu);font-size:13px}
button,input,select{font:inherit}
button{border:0;border-radius:10px;padding:10px 14px;background:var(--ac);color:#fff;cursor:pointer}
button.ghost{background:var(--ac2);color:var(--ac)}button:disabled{opacity:.4}button.w{width:100%}
input,select{width:100%;padding:10px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);margin:4px 0 10px}
.msg{padding:10px 12px;border-radius:10px;background:var(--ac2);color:var(--ac);margin-bottom:12px;font-size:14px}
.msg.err{background:#f7e3da;color:var(--wa)}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--bd);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px)}
nav div{display:flex;width:100%;max-width:480px}
nav button{flex:1;background:none;color:var(--mu);border-radius:0;padding:12px 0;font-size:12px}
nav button.on{color:var(--ac);font-weight:700}
.pt{color:var(--pt);font-weight:700}
.logo{width:96px;height:96px;border-radius:24px;display:block;margin:10px auto 8px;box-shadow:0 6px 18px rgba(31,95,214,.3)}
.mini{width:34px;height:34px;border-radius:9px;vertical-align:middle;margin-right:8px}

/* QR 생성 (관리자) */
function parse(t){
  const p=String(t).trim().split("|");let n;
  if(p.length<5||(p[0]!=="EP1"&&p[0]!=="EP2"))return null;
  try{n=p[0]==="EP2"?decodeURIComponent(escape(atob(p[1]))):decodeURIComponent(p[1])}catch(e){return null}
  return{n,p:+p[2],d:p[3],id:p[4]};
}
function makeQR(payload){
  var q=null,v,r,c;
  for(v=1;v<=10&&!q;v++){try{var t=new QREnc(v,0);t.addData(payload);t.make();q=t}catch(e){}}

  var n=q.getModuleCount(),d="";
  for(r=0;r<n;r++)for(c=0;c<n;c++)if(q.isDark(r,c))d+="M"+(c+4)+" "+(r+4)+"h1v1h-1z";
  return '<svg viewBox="0 0 '+(n+8)+' '+(n+8)+'" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges"><rect width="100%" height="100%" fill="#fff"/><path d="'+d+'" fill="#000"/></svg>';
}
function preset(i){if(i==="")return;$("an").value=ACT[i].n;$("ap").value=ACT[i].p}
function gen(){
  const n=$("an").value.trim().replace(/\|/g,""),p=parseInt($("ap").value,10),d=$("ad").value;
  if(!n||!(p>0)||!d){msg={t:"활동 이름, 포인트, 날짜를 모두 입력해 주세요.",e:1};return render()}
  const id=Math.random().toString(36).slice(2,10);
  const payload=["EP2",btoa(unescape(encodeURIComponent(n))),p,d,id].join("|");
  S.codes.unshift({n,p,d,id,payload});S.codes=S.codes.slice(0,20);show=id;save();render();
}

/* 포인트 적립 */
function award(text){
  const c=parse(text);
  if(!c||!(c.p>0)){msg={t:"교회 활동 QR 코드가 아닙니다.",e:1};return render()}
  if(c.d!==today()){msg={t:"유효 기간이 지난(또는 아직 아닌) QR 코드입니다. 유효일: "+c.d,e:1};return render()}
  if(S.used.includes(c.id)){msg={t:"이미 사용한 QR 코드입니다.",e:1};return render()}
  S.used.push(c.id);S.points+=c.p;S.history.unshift({t:"📷 "+c.n,d:c.p,w:stamp()});save();
  msg={t:c.n+" 확인! +"+c.p+"DP 적립되었습니다."};tab="home";render();
}
function buy(id){
  const it=SHOP.find(x=>x.id===id);
  if(S.points<it.p){msg={t:"드림포인트가 부족합니다.",e:1};return render()}
  S.points-=it.p;S.inv.unshift({n:it.n,i:it.i,w:stamp()});S.history.unshift({t:it.i+" "+it.n+" 구매",d:-it.p,w:stamp()});save();
  msg={t:it.n+"을(를) 구매했어요!"};render();
}
function saveProfile(){S.profile={name:$("pn").value.trim(),group:$("pg").value.trim(),phone:$("pp").value.trim()};save();msg={t:"내 정보가 저장되었습니다."};render()}

/* 스캐너 */
function note(t,e){const n=$("cm");if(n)n.innerHTML=`<div class="msg ${e?"err":""}">${esc(t)}</div>`}
function stopCam(){cancelAnimationFrame(raf);if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}}
async function startCam(){
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment",width:{ideal:1280},height:{ideal:720}}});
    const v=$("vid");v.srcObject=stream;await v.play();$("cb").style.display="none";note("QR 코드를 네모 안에 맞춰 주세요.");tick();
  }catch(e){stopCam();let m;
    if(window.top!==window)m="이 화면(앱 안 미리보기)에서는 카메라가 막혀 있어요. 링크를 복사해 Safari/Chrome 주소창에 붙여 넣어 열어 주세요.";
    else if(e&&e.name==="NotAllowedError")m="카메라 권한이 허용되지 않았어요. Safari 주소창 왼쪽 ‘aA’ → ‘웹 사이트 설정’ → ‘카메라’를 ‘허용’으로 바꾼 뒤 다시 눌러 주세요. (아이폰 설정 앱 → 앱 → Safari → 카메라도 ‘묻기’ 또는 ‘허용’이어야 해요)";
    else if(e&&e.name==="NotReadableError")m="다른 앱이 카메라를 사용 중이에요. 다른 앱을 닫고 다시 눌러 주세요.";
    else m="카메라를 열 수 없어요. (오류: "+(e&&e.name||"알 수 없음")+")";
    note(m,1)}
}
const cv=document.createElement("canvas"),cx=cv.getContext("2d",{willReadFrequently:true});
let frame=0;
function tick(){
  const v=$("vid");if(!v||!stream)return;
  if(v.readyState===v.HAVE_ENOUGH_DATA&&v.videoWidth){
    frame++;
    const k=Math.min(1,(frame%2?640:1000)/v.videoWidth),w=Math.round(v.videoWidth*k),h=Math.round(v.videoHeight*k);
    cv.width=w;cv.height=h;cx.drawImage(v,0,0,w,h);
    let r=null;try{r=qrDecode(cx.getImageData(0,0,w,h).data,w,h)}catch(e){}
    if(r){stopCam();return award(r)}
  }
  raf=requestAnimationFrame(tick);
}

/* 화면 */
function view(){
  const m=msg?`<div class="msg ${msg.e?"err":""}">${esc(msg.t)}</div>`:"";msg=null;
  if(!S.role)return `<img class="logo" src="${LOGO}" alt="드림모아"><h1 class="center" style="margin-bottom:4px">드림모아</h1><div class="mu center" style="margin-bottom:14px">함께 모아가는 우리의 꿈 ⭐</div>${m}
    <div class="card"><b>일반 성도</b><div class="mu" style="margin:4px 0 10px">QR을 스캔해 포인트를 쌓고 상점을 이용해요.</div><button class="w" onclick="login('member')">성도로 시작하기</button></div>
    <div class="card"><b>관리자</b><div class="mu" style="margin:4px 0 6px">활동 QR 코드를 만들 수 있어요. (체험용 PIN: 1234)</div>
    <input id="pin" type="password" inputmode="numeric" placeholder="관리자 PIN"><button class="w ghost" onclick="login('admin')">관리자로 시작하기</button></div>`;
  if(tab==="home"){
    const h=S.history.slice(0,8).map(x=>`<div class="row" style="padding:8px 0;border-bottom:1px solid var(--bd)"><div>${esc(x.t)}<div class="mu">${x.w}</div></div><div class="pt" style="${x.d<0?"color:var(--wa)":""}">${x.d>0?"+":""}${x.d}DP</div></div>`).join("")||'<div class="mu">아직 내역이 없어요. 스캔 탭에서 시작해 보세요.</div>';
    return `<h1><img class="mini" src="${LOGO}" alt="">안녕하세요, ${esc(S.profile.name||"성도")}님 <span class="badge">${isAdmin()?"관리자":"일반 성도"}</span></h1>${m}
    <div class="card hero"><small>보유 드림포인트</small><div class="big">${S.points}DP</div><small>${esc(S.profile.group||"소속 미등록")}</small></div>
    <h2>최근 내역</h2><div class="card">${h}</div>`;
  }
  if(tab==="scan")return `<h1>QR 스캐너</h1>${m}<div id="cm"></div>
    <div class="card"><div class="vwrap"><video id="vid" playsinline muted></video><div class="frame"></div></div>
    <button id="cb" class="w ye" style="margin-top:12px" onclick="startCam()">📷 카메라로 스캔 시작</button><div class="mu center" style="margin-top:8px">권한 요청이 뜨면 ‘허용’을 눌러 주세요.</div></div>`;
  if(tab==="shop")return `<h1>포인트 상점</h1>${m}<div class="mu" style="margin-bottom:10px">보유 드림포인트 <span class="pt">${S.points}DP</span></div>
    ${SHOP.map(x=>`<div class="card row"><div style="font-size:30px">${x.i}</div><div style="flex:1"><b>${x.n}</b><div class="pt">${x.p}DP</div></div><button onclick="buy(${x.id})" ${S.points<x.p?"disabled":""}>구매</button></div>`).join("")}
    <h2>내 아이템</h2><div class="card">${S.inv.map(x=>`<div class="row" style="padding:6px 0"><span>${x.i} ${esc(x.n)}</span><span class="mu">${x.w}</span></div>`).join("")||'<div class="mu">보유한 아이템이 없어요.</div>'}</div>`;
  if(tab==="admin"&&isAdmin()){
    const cur=S.codes.find(c=>c.id===show);
    return `<h1>QR 코드 생성 <span class="badge">관리자</span></h1>${m}
    <div class="card"><label class="mu">자주 쓰는 활동</label><select onchange="preset(this.value)"><option value="">직접 입력</option>${ACT.map((a,i)=>`<option value="${i}">${a.n} (${a.p}DP)</option>`).join("")}</select>
    <label class="mu">활동 이름</label><input id="an" placeholder="예: 주일예배">
    <label class="mu">지급 드림포인트 (DP)</label><input id="ap" type="number" min="1" placeholder="10">
    <label class="mu">유효 날짜 (이 날에만 스캔 가능)</label><input id="ad" type="date" value="${today()}">
    <button class="w ye" onclick="gen()">QR 코드 만들기</button></div>
    ${cur?`<div class="card center"><b>${esc(cur.n)}</b> · <span class="pt">+${cur.p}DP</span><div class="mu">${cur.d} 유효</div><div class="qrbox">${makeQR(cur.payload)}</div><div class="mu">화면에 띄우거나 캡처해서 인쇄하세요.</div></div>`:""}
    <h2>발급 내역</h2><div class="card">${S.codes.map(c=>`<div class="row" style="padding:6px 0"><span>${esc(c.n)} <span class="mu">${c.d} · ${c.p}DP</span></span><button class="ghost" onclick="show='${c.id}';render()">보기</button></div>`).join("")||'<div class="mu">아직 발급한 QR이 없어요.</div>'}</div>`;
  }
  return `<h1>내 정보</h1>${m}<div class="card">
    <label class="mu">이름</label><input id="pn" value="${esc(S.profile.name)}" placeholder="홍길동">
    <label class="mu">소속 (부서/소그룹)</label><input id="pg" value="${esc(S.profile.group)}" placeholder="청년부 3소그룹">
    <label class="mu">연락처</label><input id="pp" value="${esc(S.profile.phone)}" placeholder="010-0000-0000" inputmode="tel">
    <button onclick="saveProfile()">저장</button></div>
    <button class="ghost w" onclick="logout()">등급 변경 / 로그아웃 (${isAdmin()?"관리자":"일반 성도"})</button>
    <div class="mu" style="margin-top:10px">개인정보는 이 기기에만 저장되는 체험 버전입니다.</div>`;
}
function render(){
  stopCam();
  if(!S.role)tab="home";
  if(tab==="admin"&&!isAdmin())tab="home";
  $("app").innerHTML=view();
  const T=[["home","🏠","홈"],["scan","📷","스캔"],["shop","🛍️","상점"]];
  if(isAdmin())T.push(["admin","🔑","QR 생성"]);
  T.push(["me","👤","내 정보"]);
  $("nav").innerHTML=S.role?T.map(t=>`<button class="${tab===t[0]?"on":""}" onclick="tab='${t[0]}';msg=null;render()">${t[1]}<br>${t[2]}</button>`).join(""):"";
}
render();
</script>
</body>
</html>
